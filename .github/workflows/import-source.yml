name: Import JOKER source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and extract complete game source
        run: |
          curl -fL https://joker.anastasiaioseliani.space/joker-source.tar.gz -o /tmp/joker-source.tar.gz
          tar -xzf /tmp/joker-source.tar.gz

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete JOKER game source" || exit 0
          git push
